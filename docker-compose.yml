version: '3.9'

services:
  postgres:
    image: postgres:15-bookworm
    container_name: sinhala-encyclopedia-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: learn_sinhala
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d learn_sinhala']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sinhala-encyclopedia-redis
    restart: unless-stopped
    ports:
      - '6379:6379'

  app:
    build: .
    container_name: sinhala-encyclopedia-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      PORT: 3001
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/learn_sinhala
      REDIS_URL: redis://redis:6379
      LLM_PROVIDER: ${LLM_PROVIDER:-auto}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ADMIN_ACCESS_CODE: ${ADMIN_ACCESS_CODE:-SINHALA-ADMIN-2026}
    ports:
      - '3001:3001'

volumes:
  pgdata:
