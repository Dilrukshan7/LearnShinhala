services:
  - type: web
    name: learn-sinhala-encyclopedia
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: DATABASE_URL
        fromDatabase:
          name: learn-sinhala-db
          property: connectionString

databases:
  - name: learn-sinhala-db
    plan: free
    databaseName: learn_sinhala
    user: sinhala_admin
